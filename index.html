<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="Página de confirmação de maioridade.">
  <title>Confirmação de idade</title>
  <style>
    :root { color-scheme: dark; --red: #e50914; --bg: #090909; --panel: #151515; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; font-family: Inter, Arial, Helvetica, sans-serif; color: #fff; background: radial-gradient(ellipse at top, #351014 0%, #151010 36%, var(--bg) 72%); }
    .card { width: min(100%, 460px); padding: 38px 28px 30px; text-align: center; background: rgba(18,18,18,.94); border: 1px solid rgba(229,9,20,.55); border-radius: 22px; box-shadow: 0 24px 80px rgba(0,0,0,.55), 0 0 32px rgba(229,9,20,.12); }
    .mark { width: 76px; height: 76px; display: grid; place-items: center; margin: 0 auto 22px; border: 2px solid var(--red); border-radius: 50%; color: var(--red); font-weight: 900; font-size: 26px; letter-spacing: -2px; box-shadow: 0 0 24px rgba(229,9,20,.18); }
    .eyebrow { margin: 0 0 10px; color: #ff777d; font-size: 12px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0 auto 14px; font-size: clamp(28px, 7vw, 38px); line-height: 1.08; letter-spacing: -.04em; }
    h1 span { color: var(--red); }
    .description { max-width: 330px; margin: 0 auto 26px; color: #c8c8c8; font-size: 15px; line-height: 1.6; }
    .cta { width: 100%; min-height: 56px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 15px 18px; border: 0; border-radius: 12px; background: linear-gradient(135deg, #ff202a, #c9000a); color: #fff; font-size: 15px; font-weight: 800; text-decoration: none; cursor: pointer; box-shadow: 0 10px 24px rgba(229,9,20,.24); transition: transform .15s ease, filter .15s ease; }
    .cta:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .cta:focus-visible, .exit:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .note { margin: 18px 0 0; color: #858585; font-size: 11px; line-height: 1.5; }
    .status { min-height: 20px; margin-top: 14px; color: #ffb5b8; font-size: 12px; line-height: 1.5; }
    .exit { display: inline-block; margin-top: 12px; color: #aaa; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
    @media (max-width: 380px) { .card { padding: 30px 20px 24px; } }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="page-title">
    <div class="mark" aria-hidden="true">18+</div>
    <p class="eyebrow">Acesso restrito</p>
    <h1 id="page-title">Você tem mais de <span>18 anos?</span></h1>
    <p class="description">Se você tem mais de 18 anos, clique no botão abaixo para continuar.</p>
    <button class="cta" id="continue-button" type="button">SE VOCÊ TEM MAIS DE 18, CLIQUE AQUI <span aria-hidden="true">→</span></button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <a class="exit" href="https://www.google.com/" id="exit-link">Não tenho 18 anos</a>
    <p class="note">Ao continuar, você confirma que tem 18 anos ou mais. A confirmação não substitui as regras legais ou os requisitos de acesso do site de destino.</p>
  </main>
  <script>
    // Link de convite do grupo no Telegram.
    const DESTINATION_URL = "https://t.me/+Tqolcmy2CrhjYjcx";
    document.getElementById("continue-button").addEventListener("click", () => {
      try {
        const destination = new URL(DESTINATION_URL);
        window.location.href = destination.href;
      } catch {
        document.getElementById("status").textContent = "O link de destino não está configurado corretamente. Edite DESTINATION_URL no arquivo index.html.";
      }
    });
  </script>
</body>
</html>
